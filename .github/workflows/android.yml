name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', 'index.html', 'app.js', 'data.json', 'kjv.json', 'web.json', '.github/workflows/android.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace
      - name: Stage APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk woven-word.apk
      - uses: actions/upload-artifact@v4
        with: { name: woven-word-apk, path: woven-word.apk }
      - name: Publish to apk-latest release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release delete apk-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create apk-latest woven-word.apk --title 'Woven Word for Android' --notes 'Installable APK of Woven Word. Download woven-word.apk on your phone and tap to install (allow installs from your browser if asked).'
