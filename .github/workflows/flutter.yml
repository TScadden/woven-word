name: Build Flutter app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['flutter/**', '.github/workflows/flutter.yml']
jobs:
  android:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.47.7', channel: stable, cache: true }
      - name: Analyze and test
        working-directory: flutter
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Decode release keystore
        env:
          KS_B64: ${{ secrets.WOVEN_KEYSTORE_BASE64 }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/woven-word-release.jks"
          echo "WOVEN_KEYSTORE_PATH=$RUNNER_TEMP/woven-word-release.jks" >> "$GITHUB_ENV"
      - name: Build release APK (split per ABI)
        working-directory: flutter
        env:
          WOVEN_KEY_ALIAS: ${{ secrets.WOVEN_KEY_ALIAS }}
          WOVEN_KEY_PASSWORD: ${{ secrets.WOVEN_KEY_PASSWORD }}
          WOVEN_STORE_PASSWORD: ${{ secrets.WOVEN_STORE_PASSWORD }}
        run: flutter build apk --release --split-per-abi
      - name: Stage arm64 APK
        run: cp flutter/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk woven-word-flutter.apk
      - name: Print signer certificate
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs woven-word-flutter.apk | grep -i "SHA-256 digest"
      - uses: actions/upload-artifact@v4
        with: { name: woven-word-flutter-apk, path: woven-word-flutter.apk }
      - name: Publish to flutter-apk-latest release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release delete flutter-apk-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create flutter-apk-latest woven-word-flutter.apk --title 'Woven Word Flutter (test builds)' --notes 'Flutter rebuild test builds of Woven Word, one screen at a time. Download woven-word-flutter.apk on your phone and tap to install.'
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.47.7', channel: stable, cache: true }
      - name: Build web (release, /woven-word/ base href — feeds the Pages deploy)
        working-directory: flutter
        run: |
          flutter pub get
          flutter build web --release --base-href=/woven-word/
      - uses: actions/upload-artifact@v4
        with: { name: woven-word-flutter-web, path: flutter/build/web }
  pages:
    needs: web
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: woven-word-flutter-web, path: _site }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.47.7', channel: stable, cache: true }
      - name: Build iOS (compile check, no signing)
        working-directory: flutter
        run: |
          flutter pub get
          flutter build ios --no-codesign
