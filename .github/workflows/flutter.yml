name: Build Flutter app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['flutter/**', '.github/workflows/flutter.yml']
jobs:
  android:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.47.7', channel: stable, cache: true }
      - name: Analyze and test
        working-directory: flutter
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Build release APK (split per ABI)
        working-directory: flutter
        run: flutter build apk --release --split-per-abi
      - name: Stage arm64 APK
        run: cp flutter/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk woven-word-flutter.apk
      - uses: actions/upload-artifact@v4
        with: { name: woven-word-flutter-apk, path: woven-word-flutter.apk }
      - name: Publish to flutter-apk-latest release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release delete flutter-apk-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create flutter-apk-latest woven-word-flutter.apk --title 'Woven Word Flutter (test builds)' --notes 'Flutter rebuild test builds of Woven Word, one screen at a time. Download woven-word-flutter.apk on your phone and tap to install.'
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.47.7', channel: stable, cache: true }
      - name: Build web (compile check; Pages still serves web v1 until parity)
        working-directory: flutter
        run: |
          flutter pub get
          flutter build web --release
      - uses: actions/upload-artifact@v4
        with: { name: woven-word-flutter-web, path: flutter/build/web }
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.47.7', channel: stable, cache: true }
      - name: Build iOS (compile check, no signing)
        working-directory: flutter
        run: |
          flutter pub get
          flutter build ios --no-codesign
