plugins { id 'com.android.application' }
android {
    namespace 'com.tscadden.wovenword'
    compileSdk 34
    defaultConfig {
        applicationId 'com.tscadden.wovenword'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.webkit:webkit:1.11.0' }
tasks.register('copyWebAssets', Copy) {
    from(rootProject.projectDir.parentFile) {
        include 'index.html', 'app.js', 'data.json', 'kjv.json', 'web.json', 'manifest.json', 'icon-512.png'
    }
    into layout.projectDirectory.dir('src/main/assets/www')
}
tasks.named('preBuild') { dependsOn('copyWebAssets') }
